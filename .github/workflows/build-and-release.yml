name: Parma CI/CD — Multi-Platform Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Compilación para Windows (Instalador Inno Setup + ZIP Portable)
  # ============================================================================
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (Vite + React)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Inno Setup Compiler (ISCC)
        shell: powershell
        run: |
          $standardPaths = @(
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          )
          $found = $standardPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Inno Setup no detectado en rutas estándar. Instalando vía Chocolatey..."
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Inno Setup ya disponible en: $found"
          }

      - name: Instalar Dependencias del Frontend
        run: |
          cd frontend
          npm install --include=optional --no-audit

      - name: Verificar Tipos del Frontend (tsc)
        run: |
          cd frontend
          npx tsc -b

      - name: Compilar Frontend (React 18 + Vite)
        run: |
          cd frontend
          npm run build

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar Iconos de Alto Contraste (Escudo Sólido)
        run: python scripts/generate_taskbar_icons.py

      - name: Compilar Binario PyInstaller (Windows Onedir)
        run: python build_desktop.py

      - name: Compilar Instalador Oficial Setup (.exe con Inno Setup)
        shell: powershell
        run: |
          $iscc = @(
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\iscc.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          }

          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) no fue encontrado en el sistema."
          }

          Write-Host "Compilando instalador Inno Setup con: $iscc"
          $ver = (python scripts/get_version.py).Trim()
          & $iscc "/DMyAppVersion=$ver" "ejecutables\windows\installer\parma_setup.iss"

      - name: Guardar Artefactos de Windows (Test Compilation)
        uses: actions/upload-artifact@v4
        with:
          name: parma-windows-build
          if-no-files-found: warn
          path: |
            ejecutables/windows/Parma-Setup-*.exe
            ejecutables/windows/Parma-Windows-Portable.zip
          retention-days: 14

  # ============================================================================
  # 2. Compilación para Linux (Paquete .deb para Pop!_OS/Ubuntu + Tarball)
  # ============================================================================
  build-linux:
    name: Build Linux (.deb & Portable Tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (Vite + React)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependencias del Sistema Linux (WebKitGTK, Cairo, GObject & Build Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev pkg-config meson ninja-build \
            libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            python3-gi dpkg
          sudo apt-get install -y --no-install-recommends libgirepository-2.0-dev || sudo apt-get install -y --no-install-recommends libgirepository1.0-dev

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias del Frontend
        run: |
          cd frontend
          npm install --include=optional --no-audit

      - name: Verificar Tipos del Frontend (tsc)
        run: |
          cd frontend
          npx tsc -b

      - name: Compilar Frontend (React 18 + Vite)
        run: |
          cd frontend
          npm run build

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyGObject pycairo

      - name: Generar Iconos de Alto Contraste (Escudo Sólido)
        run: python scripts/generate_taskbar_icons.py

      - name: Compilar Binario PyInstaller (Linux Onedir)
        run: python build_desktop.py

      - name: Empaquetar Tarball Portable (.tar.gz) con Launcher parma.sh
        run: |
          cp ejecutables/linux/parma.sh ejecutables/linux/Parma/parma.sh 2>/dev/null || true
          chmod 755 ejecutables/linux/Parma/parma.sh
          chmod 755 ejecutables/linux/Parma/Parma
          cd ejecutables/linux
          tar -czf Parma-Linux-Portable.tar.gz Parma
          cd ../..

      - name: Generar Paquete Debian Oficial (.deb)
        run: python ejecutables/linux/deb/build_deb.py

      - name: Guardar Artefactos de Linux (Test Compilation)
        uses: actions/upload-artifact@v4
        with:
          name: parma-linux-build
          if-no-files-found: warn
          path: |
            ejecutables/linux/parma_*_amd64.deb
            ejecutables/linux/Parma-Linux-Portable.tar.gz
          retention-days: 14

  # ============================================================================
  # 3. Publicación Oficial en el Perfil Público (Rama 'main', Tags o Dispatch)
  # ============================================================================
  publish-release:
    name: Publicar Release Oficial en GitHub
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Descargar Artefactos de Windows
        uses: actions/download-artifact@v4
        with:
          name: parma-windows-build
          path: dist_release/windows

      - name: Descargar Artefactos de Linux
        uses: actions/download-artifact@v4
        with:
          name: parma-linux-build
          path: dist_release/linux

      - name: Organizar Artefactos para Publicación
        run: |
          mkdir -p release_assets
          find dist_release -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp -v {} release_assets/ \;
          echo "=== Archivos recolectados para la release ==="
          ls -la release_assets/

      - name: Determinar Versión de la Release
        id: release_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            VER=$(python3 scripts/get_version.py 2>/dev/null || echo "1.0.1")
            echo "TAG_NAME=v${VER}" >> $GITHUB_ENV
          fi

      - name: Publicar Release Oficial en el Perfil Público
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Parma Desktop ${{ env.TAG_NAME }} — Release Oficial"
          body: |
            ## ⚔️ Parma — Character Hub & Grimoire (${{ env.TAG_NAME }})

            Compilación oficial multiplataforma generada automáticamente para Windows y Linux.

            ### 📦 Descargables Disponibles:
            - **Windows**:
              - 💾 `Parma-Setup-*.exe` — Instalador guiado con accesos directos y desinstalador (Inno Setup).
              - 📁 `Parma-Windows-Portable.zip` — Versión portable lista para ejecutar.
            - **Linux**:
              - 🐧 `parma_*_amd64.deb` — Paquete oficial para Pop!_OS, Ubuntu, Linux Mint y Debian.
              - 📦 `Parma-Linux-Portable.tar.gz` — Paquete comprimido portable para cualquier distro Linux.

            ---
            *Compilado con PyWebView, WebKitGTK / WebView2, React 18 y sincronización 3D con TaleSpire.*
          draft: false
          prerelease: false
          make_latest: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
